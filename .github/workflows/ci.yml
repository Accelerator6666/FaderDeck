name: FaderDeck CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-core:
    name: Windows .NET build and core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build CLI and core
        run: dotnet build software/FaderDeck.Cli/FaderDeck.Cli.csproj -c Release
      - name: Run core tests
        run: dotnet run --project tests/FaderDeck.Core.Tests -c Release
      - name: Run hardware-free simulator demo
        run: dotnet run --project software/FaderDeck.Cli -c Release -- sim --demo
      - name: Publish standalone Windows x64 CLI
        run: dotnet publish software/FaderDeck.Cli/FaderDeck.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist/windows
      - name: Upload Windows diagnostic CLI
        uses: actions/upload-artifact@v4
        with:
          name: FaderDeck-Windows-CLI
          path: dist/windows/
          if-no-files-found: error
          retention-days: 30

  esp32-firmware:
    name: ESP32-S3 ESP-IDF build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build M0 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: firmware/esp32-s3
      - name: Upload ESP32-S3 binaries and flashing metadata
        uses: actions/upload-artifact@v4
        with:
          name: FaderDeck-ESP32S3-M0
          path: |
            firmware/esp32-s3/build/bootloader/bootloader.bin
            firmware/esp32-s3/build/partition_table/partition-table.bin
            firmware/esp32-s3/build/faderdeck_m0.bin
            firmware/esp32-s3/build/flasher_args.json
          if-no-files-found: error
          retention-days: 30
